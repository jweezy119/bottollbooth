name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run engine + service smoke tests
        run: npm test
      - name: Run demo
        run: node examples/demo.js --rpm 15
      - name: Run BYOD access-log importer on the fixture
        run: |
          node examples/accesslog-to-ingest.js examples/fixtures/access.log --limit 4 >/dev/null
          cat examples/fixtures/access.log | node examples/accesslog-to-ingest.js --limit 4 >/dev/null
      - name: Run site-report with purpose + digest
        run: |-
          node examples/site-report.js examples/fixtures/access.log --namespace shop.example.com | grep -q "digest: sha256"
          node examples/site-report.js examples/fixtures/access.log --namespace shop.example.com --write-dir /tmp/btb-out >/dev/null
          grep -q "User-agent: GPTBot" /tmp/btb-out/robots.txt
          grep -q '"verdict"' /tmp/btb-out/opt-outs.json
          node examples/site-report.js examples/fixtures/access.log --namespace shop.example.com | grep -q "5. Bandwidth & cost impact"
      - name: Boot analytics service and hit the API
        run: |
          node src/service/server.js & API_PID=$!
          sleep 2
          curl -fsS http://localhost:8080/health
          curl -fsS "http://localhost:8080/api/v1/classify?ua=Bytespider" | grep -q '"category":"ai-crawler"'
          node examples/accesslog-to-ingest.js examples/fixtures/access.log --post http://localhost:8080 --namespace shop.example.com
          curl -fsS "http://localhost:8080/api/v1/report?namespace=shop.example.com&rpm=15" | grep -q '"ai-crawler":'
          curl -fsS "http://localhost:8080/api/v1/report?namespace=shop.example.com&rpm=15" | grep -q '"valueExchange"'
          curl -fsS "http://localhost:8080/api/v1/report?namespace=shop.example.com&rpm=15" | grep -q '"digest"'
          curl -fsS "http://localhost:8080/api/v1/report?namespace=shop.example.com&rpm=15" | grep -q '"crawlers"'
          curl -fsS "http://localhost:8080/api/v1/report?namespace=shop.example.com&rpm=15" | grep -q '"bandwidth"'
          curl -fsS "http://localhost:8080/api/v1/compliance?namespace=shop.example.com" | grep -q '"robotsTxt"'
          curl -fsS "http://localhost:8080/api/v1/compliance?namespace=shop.example.com" | grep -q 'User-agent: GPTBot'
          curl -fsS http://localhost:8080/probe.js | grep -q 'BotTollboothProbe'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:8080/api/v1/audit" -H "Content-Type: application/json" -d '{}')
          if [ "$code" != "400" ]; then echo "expected 400 missing url, got $code"; exit 1; fi
          curl -s -X POST "http://localhost:8080/api/v1/audit" -H "Content-Type: application/json" -d '{"url":"http://127.0.0.1/x"}' | grep -q 'blocked_ssrf'
          curl -fsS http://localhost:8080/audit | grep -q 'Run audit'
          curl -fsS http://localhost:8080/app | grep -q 'Load sample traffic'
          curl -fsS "http://localhost:8080/api/v1/namespaces" | grep -q '"namespaces":'
          kill $API_PID
      - name: Verify workspace persistence across a service restart
        run: |
          export DATA_DIR=/tmp/btb-persist
          node src/service/server.js & API_PID=$!
          sleep 2
          curl -fsS -X POST "http://localhost:8080/api/v1/ingest" -H "Content-Type: application/json" -d '{"namespace":"persist.example.com","rows":[{"userAgent":"GPTBot/1.2 (+https://openai.com/gptbot)"}]}' >/dev/null
          kill $API_PID
          sleep 1
          node src/service/server.js & API_PID=$!
          sleep 2
          curl -fsS "http://localhost:8080/api/v1/report?namespace=persist.example.com" | grep -q '"ai-crawler":1'
          kill $API_PID
      - name: Verify token-gated API
        run: |
          BOTTOLLBOOTH_TOKEN=ci-secret node src/service/server.js & API_PID=$!
          sleep 2
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/api/v1/classify?ua=Bytespider")
          if [ "$code" != "401" ]; then echo "expected 401 without token, got $code"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://localhost:8080/api/v1/audit" -H "Content-Type: application/json" -d '{"url":"https://example.com"}')
          if [ "$code" != "401" ]; then echo "expected 401 audit without token, got $code"; exit 1; fi
          curl -fsS -H "Authorization: Bearer ci-secret" "http://localhost:8080/api/v1/classify?ua=Bytespider" | grep -q 'ai-crawler'
          curl -fsS http://localhost:8080/health >/dev/null
          kill $API_PID
      - name: Build container image
        run: docker build -t bottollbooth:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --rm --name bottollbooth-ci -p 8123:8080 bottollbooth:ci
          for i in $(seq 1 25); do
            if curl -fsS http://localhost:8123/health; then break; fi
            sleep 1
          done
          ok=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8123/health 2>/dev/null || echo 000)
          if [ "$ok" != "200" ]; then
            echo "container never became ready (http $ok)"
            docker ps
            docker logs bottollbooth-ci 2>&1 || true
            exit 1
          fi
          docker stop bottollbooth-ci