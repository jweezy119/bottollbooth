name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run engine + service smoke tests
        run: npm test
      - name: Run demo
        run: node examples/demo.js --rpm 15
      - name: Run BYOD access-log importer on the fixture
        run: |
          node examples/accesslog-to-ingest.js examples/fixtures/access.log --limit 4 >/dev/null
          cat examples/fixtures/access.log | node examples/accesslog-to-ingest.js --limit 4 >/dev/null
      - name: Boot analytics service and hit the API
        run: |
          node src/service/server.js & API_PID=$!
          sleep 2
          curl -fsS http://localhost:8080/health
          curl -fsS "http://localhost:8080/api/v1/classify?ua=Bytespider" | grep -q '"category":"ai-crawler"'
          node examples/accesslog-to-ingest.js examples/fixtures/access.log --post http://localhost:8080 --namespace shop.example.com
          curl -fsS "http://localhost:8080/api/v1/report?namespace=shop.example.com&rpm=15" | grep -q '"ai-crawler":'
          kill $API_PID
      - name: Build container image
        run: docker build -t bottollbooth:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --rm --name bottollbooth-ci -p 8123:8080 bottollbooth:ci
          sleep 3
          curl -fsS http://localhost:8123/health
          docker stop bottollbooth-ci