name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run smoke test
        run: node test/engine.test.js
      - name: Run demo
        run: node examples/demo.js --rpm 15